<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音对话助手 - 跨浏览器版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #333;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #999;
            text-align: center;
            margin-bottom: 20px;
        }

        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status-item {
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }

        .status-item.connected {
            border-left-color: #28a745;
        }

        .status-item.disconnected {
            border-left-color: #dc3545;
        }

        .btn {
            display: block;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .btn:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-stop {
            background: #e74c3c;
        }

        .btn-stop:hover:not(:disabled) {
            background: #c0392b;
        }

        #chat-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            height: 250px;
            overflow-y: auto;
            display: none;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user {
            background: #dbeafe;
            text-align: right;
            color: #1e40af;
        }

        .message.ai {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            text-align: center;
            font-size: 13px;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 13px;
            border-left: 4px solid #ef4444;
        }

        .info-box {
            background: #dbeafe;
            color: #1e40af;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 13px;
            border-left: 4px solid #3b82f6;
        }

        .browser-support {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 5px;
            border-left: 4px solid #f59e0b;
        }

        .browser-support strong {
            color: #92400e;
        }

        .api-support {
            font-size: 11px;
            margin: 5px 0;
            padding: 5px 8px;
            background: white;
            border-radius: 3px;
        }

        .api-support.supported {
            color: #059669;
            border-left: 2px solid #059669;
        }

        .api-support.not-supported {
            color: #dc2626;
            border-left: 2px solid #dc2626;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .recording {
            animation: pulse 1s infinite;
            color: #e74c3c !important;
            font-weight: bold;
        }

        .loading {
            display: inline-block;
            margin-left: 10px;
        }

        .loading:after {
            content: '...';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 语音对话助手</h1>
        <p class="subtitle">跨浏览器版本 - 支持 Chrome / Firefox / Safari</p>

        <div class="error-box" id="error-container" style="display: none;">
            <strong>错误：</strong> <span id="error-message"></span>
        </div>

        <div class="info-box" id="info-container" style="display: none;">
            <strong>提示：</strong> <span id="info-message"></span>
        </div>

        <div class="status">
            <h3>状态检查</h3>
            <div class="status-item disconnected" id="mic-status">
                🎤 麦克风：<span>未连接</span>
            </div>
            <div class="status-item disconnected" id="speech-status">
                🗣️ 语音识别：<span>未检查</span>
            </div>
            <div class="status-item disconnected" id="tts-status">
                🔊 语音合成：<span>未检查</span>
            </div>
            <div class="status-item disconnected" id="ai-status">
                🤖 AI连接：<span>未检查</span>
            </div>
        </div>

        <div class="browser-support" id="browser-info">
            检查浏览器和API兼容性<span class="loading"></span>
        </div>

        <button class="btn" id="btn-check">检查兼容性</button>
        <button class="btn" id="btn-start" disabled>开始对话</button>
        <button class="btn btn-stop" id="btn-stop" disabled>停止</button>

        <div id="chat-container">
            <div class="message ai">
                👋 你好！我是你的语音助手。先点击"检查兼容性"按钮。
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const micStatus = document.getElementById('mic-status');
        const speechStatus = document.getElementById('speech-status');
        const ttsStatus = document.getElementById('tts-status');
        const aiStatus = document.getElementById('ai-status');
        const btnCheck = document.getElementById('btn-check');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const chatContainer = document.getElementById('chat-container');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const infoContainer = document.getElementById('info-container');
        const infoMessage = document.getElementById('info-message');
        const browserInfo = document.getElementById('browser-info');

        let recognition = null;
        let isListening = false;
        let browserName = 'Unknown';

        // 显示错误
        function showError(message, autoHide = true) {
            errorMessage.textContent = message;
            errorContainer.style.display = 'block';
            infoContainer.style.display = 'none';

            if (autoHide) {
                setTimeout(() => {
                    errorContainer.style.display = 'none';
                }, 12000);
            }
        }

        // 显示提示
        function showInfo(message, autoHide = true) {
            infoMessage.textContent = message;
            infoContainer.style.display = 'block';
            errorContainer.style.display = 'none';

            if (autoHide) {
                setTimeout(() => {
                    infoContainer.style.display = 'none';
                }, 10000);
            }
        }

        // 添加消息
        function addMessage(text, type = 'ai') {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 更新状态
        function updateStatus(element, text, connected = false) {
            if (connected) {
                element.className = 'status-item connected';
                element.querySelector('span').textContent = text;
                element.querySelector('span').style.color = 'green';
            } else {
                element.className = 'status-item disconnected';
                element.querySelector('span').textContent = text;
                element.querySelector('span').style.color = 'red';
            }
        }

        // 检查浏览器兼容性
        function checkBrowserSupport() {
            // 检测浏览器
            const userAgent = navigator.userAgent;
            if (userAgent.includes('Firefox')) {
                browserName = `Firefox ${userAgent.match(/Firefox\/(\d+)/)[1]}`;
            } else if (userAgent.includes('Chrome') && !userAgent.includes('Edg')) {
                browserName = `Chrome ${userAgent.match(/Chrome\/(\d+)/)[1]}`;
            } else if (userAgent.includes('Safari') && !userAgent.includes('Chrome')) {
                browserName = `Safari ${userAgent.match(/Version\/(\d+)/)[1]}`;
            } else if (userAgent.includes('Edg')) {
                browserName = `Edge ${userAgent.match(/Edg\/(\d+)/)[1]}`;
            }

            // 构建API支持信息
            let apiInfo = '';

            // 检查语音合成（基本都支持）
            const ttsSupported = 'speechSynthesis' in window;
            apiInfo += `<div class="api-support ${ttsSupported ? 'supported' : 'not-supported'}">`;
            apiInfo += ttsSupported ? '✅ 语音合成' : '❌ 语音合成';
            apiInfo += '</div>';

            if (ttsSupported) {
                updateStatus(ttsStatus, '已就绪', true);
            } else {
                updateStatus(ttsStatus, '不支持', false);
                showError('你的浏览器不支持语音合成！', false);
            }

            // 检查语音识别 - Firefox使用SpeechRecognition，Chrome使用webkitSpeechRecognition
            const hasWebkitSpeech = 'webkitSpeechRecognition' in window;
            const hasStandardSpeech = 'SpeechRecognition' in window;

            apiInfo += `<div class="api-support ${hasWebkitSpeech || hasStandardSpeech ? 'supported' : 'not-supported'}">`;
            if (hasWebkitSpeech) {
                apiInfo += '✅ WebKit Speech Recognition (Chrome)';
            }
            if (hasStandardSpeech) {
                apiInfo += '✅标准 Speech Recognition (Firefox)';
            }
            if (!hasWebkitSpeech && !hasStandardSpeech) {
                apiInfo += '❌ 语音识别API';
            }
            apiInfo += '</div>';

            if (hasWebkitSpeech || hasStandardSpeech) {
                // Firefox使用标准API，Chrome使用webkit前缀
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();

                // 配置识别
                recognition.lang = 'zh-CN';
                recognition.continuous = true;
                recognition.interimResults = false;

                // 识别结果
                recognition.onresult = (event) => {
                    const lastResult = event.results[event.results.length - 1];
                    const text = lastResult[0].transcript;
                    addMessage(`你：${text}`, 'user');
                    sendToAI(text);
                };

                // 错误处理
                recognition.onerror = (event) => {
                    console.error('语音识别错误:', event.error);

                    // 忽略一些无害错误
                    if (event.error === 'no-speech' || event.error === 'aborted') {
                        return; // 不显示这些常见错误
                    }

                    addMessage(`⚠️ 语音识别：${event.error}`, 'ai');

                    // 根据错误类型显示提示
                    if (event.error === 'not-allowed') {
                        showError('麦克风权限被拒绝！请允许网站访问麦克风。');
                        showInfo('💡 在浏览器地址栏点击锁定图标，允许麦克风权限。');
                    }
                };

                // 持续监听
                recognition.onend = () => {
                    if (isListening) {
                        // 自动重启
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch (e) {
                                console.error('重启语音识别失败:', e);
                                isListening = false;
                                btnStart.disabled = false;
                                btnStop.disabled = true;
                                updateStatus(micStatus, '已停止', false);
                            }
                        }, 100);
                    }
                };

                updateStatus(speechStatus, '已就绪', true);
            } else {
                updateStatus(speechStatus, '不支持', false);

                let errorMsg = '你的浏览器不支持语音识别！';
                if (browserName.includes('Safari')) {
                    errorMsg += 'Safari可能需要手动设置或在HTTPS下使用。';
                } else {
                    errorMsg += '请使用Chrome或Firefox浏览器。';
                }
                showError(errorMsg, false);
            }

            // 测试AI连接
            updateStatus(aiStatus, '测试中...', false);
            testAIConnection();

            // 更新浏览器信息
            browserInfo.innerHTML = `<strong>检测到浏览器：</strong>${browserName}<br>` + apiInfo;

            btnCheck.disabled = true;
        }

        // 测试AI连接
        async function testAIConnection() {
            try {
                const response = await fetch('http://120.48.89.60:8889/health');
                if (response.ok) {
                    updateStatus(aiStatus, '已连接', true);
                    showInfo('✅ 所有检查通过！准备就绪。点击"开始对话"开始。');

                    // 如果语音识别也OK，启用开始按钮
                    const speechText = speechStatus.querySelector('span').textContent;
                    if (speechText === '已就绪') {
                        btnStart.disabled = false;
                    }

                    return true;
                } else {
                    throw new Error('响应不正常');
                }
            } catch (error) {
                updateStatus(aiStatus, '连接失败', false);
                showError(`无法连接AI服务器：${error.message}`);
                showInfo('💡 请告诉我，我会检查服务器。');
                return false;
            }
        }

        // 开始/停止
        function toggleListening() {
            if (isListening) {
                recognition.stop();
                isListening = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                updateStatus(micStatus, '已停止', false);
                addMessage('⏹️ 已停止对话', 'ai');
            } else {
                try {
                    recognition.start();
                    isListening = true;
                    btnStart.disabled = true;
                    btnStop.disabled = false;
                    updateStatus(micStatus, '正在监听...', true);
                    micStatus.querySelector('span').classList.add('recording');
                    chatContainer.style.display = 'block';
                    addMessage('🎤 开始说话...', 'ai');
                    showInfo('💡 对着麦克风说话，我会听到的！');
                } catch (error) {
                    showError(`启动失败：${error.message}`);
                    console.error('启动语音识别失败:', error);
                }
            }
        }

        // 发送到AI
        async function sendToAI(text) {
            try {
                addMessage('⏳ AI正在思考...', 'ai');

                const response = await fetch('http://120.48.89.60:8889/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // 移除"AI正在思考"
                const lastMsg = chatContainer.lastChild;
                if (lastMsg && lastMsg.textContent.includes('AI正在思考')) {
                    chatContainer.removeChild(lastMsg);
                }

                if (data.success) {
                    addMessage(`🤖：${data.text}`, 'ai');

                    // 语音合成
                    try {
                        const utterance = new SpeechSynthesisUtterance(data.text);
                        utterance.lang = 'zh-CN';
                        utterance.rate = 1;
                        utterance.pitch = 1;
                        speechSynthesis.speak(utterance);
                    } catch (e) {
                        console.error('语音合成失败:', e);
                    }

                    updateStatus(micStatus, '正在监听...', true);
                } else {
                    addMessage(`❌ AI错误：${data.error || '未知错误'}`, 'ai');
                }

            } catch (error) {
                // 移除"AI正在思考"
                const lastMsg = chatContainer.lastChild;
                if (lastMsg && lastMsg.textContent.includes('AI正在思考')) {
                    chatContainer.removeChild(lastMsg);
                }

                addMessage(`❌ 连接AI失败：${error.message}`, 'ai');
                console.error('AI错误:', error);
                showError('AI连接失败，请稍后重试。');
            }
        }

        // 事件监听
        btnCheck.addEventListener('click', checkBrowserSupport);
        btnStart.addEventListener('click', () => {
            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    btnStart.disabled = true;
                    btnStop.disabled = false;
                    updateStatus(micStatus, '正在监听...', true);
                    micStatus.querySelector('span').classList.add('recording');
                    chatContainer.style.display = 'block';
                    addMessage('🎤 开始说话...', 'ai');
                    showInfo('💡 对着麦克风说话，我会听到的！');
                } catch (error) {
                    showError(`启动失败：${error.message}`);
                }
            }
        });

        btnStop.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                isListening = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                updateStatus(micStatus, '已停止', false);
                micStatus.querySelector('span').classList.remove('recording');
                addMessage('⏹️ 已停止对话', 'ai');
            }
        });

        // 页面加载提示
        setTimeout(() => {
            showInfo('💡 首先点击"检查兼容性"按钮');
        }, 1500);
    </script>
</body>
</html>
