<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟伴侣 - 超简化版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #333;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #999;
            text-align: center;
            margin-bottom: 20px;
        }

        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .status-item {
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }

        .status-item.connected {
            border-left-color: #28a745;
        }

        .status-item.disconnected {
            border-left-color: #dc3545;
        }

        .btn {
            display: block;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-stop {
            background: #e74c3c;
        }

        .btn-stop:hover {
            background: #c0392b;
        }

        #chat-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            height: 250px;
            overflow-y: auto;
            display: none;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        .message.user {
            background: #dbeafe;
            text-align: right;
            color: #1e40af;
        }

        .message.ai {
            background: #f3e8ff;
            color: #7c3aed;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            text-align: center;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
            text-align: center;
        }

        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 13px;
        }

        .info-box {
            background: #dbeafe;
            color: #1e40af;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 13px;
        }

        .browser-support {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .recording {
            animation: pulse 1s infinite;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 语音对话助手</h1>
        <p class="subtitle">纯语音版本 - 无需摄像头</p>

        <div class="error-box" id="error-container" style="display: none;">
            <strong>错误：</strong> <span id="error-message"></span>
        </div>

        <div class="info-box" id="info-container" style="display: none;">
            <strong>提示：</strong> <span id="info-message"></span>
        </div>

        <div class="status">
            <h3>状态检查</h3>
            <div class="status-item disconnected" id="mic-status">
                🎤 麦克风：<span>未连接</span>
            </div>
            <div class="status-item disconnected" id="speech-status">
                🗣️ 语音识别：<span>未检查</span>
            </div>
            <div class="status-item disconnected" id="ai-status">
                🤖 AI连接：<span>未检查</span>
            </div>
        </div>

        <div class="browser-support" id="browser-info">
            检查浏览器兼容性...
        </div>

        <button class="btn" id="btn-check">检查浏览器兼容性</button>
        <button class="btn" id="btn-start" disabled>开始对话</button>
        <button class="btn btn-stop" id="btn-stop" disabled>停止</button>

        <div id="chat-container">
            <div class="message ai">
                👋 你好！我是你的语音助手。
            </div>
        </div>
    </div>

    <script>
        // DOM元素
        const micStatus = document.getElementById('mic-status');
        const speechStatus = document.getElementById('speech-status');
        const aiStatus = document.getElementById('ai-status');
        const btnCheck = document.getElementById('btn-check');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const chatContainer = document.getElementById('chat-container');
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        const infoContainer = document.getElementById('info-container');
        const infoMessage = document.getElementById('info-message');
        const browserInfo = document.getElementById('browser-info');

        let recognition = null;
        let isListening = false;
        let isMicPermissionGranted = false;

        // 显示错误
        function showError(message) {
            errorMessage.textContent = message;
            errorContainer.style.display = 'block';
            infoContainer.style.display = 'none';

            // 自动隐藏
            setTimeout(() => {
                errorContainer.style.display = 'none';
            }, 10000);
        }

        // 显示提示
        function showInfo(message) {
            infoMessage.textContent = message;
            infoContainer.style.display = 'block';
            errorContainer.style.display = 'none';

            setTimeout(() => {
                infoContainer.style.display = 'none';
            }, 8000);
        }

        // 添加消息
        function addMessage(text, type = 'ai') {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 更新状态
        function updateStatus(element, text, connected = false) {
            element.className = connected ? 'status-item connected' : 'status-item disconnected';
            element.querySelector('span').textContent = text;
            if (connected) {
                element.querySelector('span').style.color = 'green';
            }
        }

        // 检查浏览器兼容性
        function checkBrowserSupport() {
            const userAgent = navigator.userAgent;
            let browser = 'Unknown';

            if (userAgent.includes('Chrome')) {
                browser = `Chrome ${userAgent.match(/Chrome\/(\d+)/)[1]}`;
            } else if (userAgent.includes('Safari')) {
                browser = `Safari ${userAgent.match(/Version\/(\d+)/)[1]}`;
            } else if (userAgent.includes('Firefox')) {
                browser = `Firefox ${userAgent.match(/Firefox\/(\d+)/)[1]}`;
            } else if (userAgent.includes('Edge')) {
                browser = `Edge`;
            }

            browserInfo.textContent = `检测到浏览器：${browser}`;

            // 检查语音合成
            if ('speechSynthesis' in window) {
                speechStatus.innerHTML = '🗣️ 语音识别：<span style="color: green;">支持</span>';
            } else {
                speechStatus.innerHTML = '🗣️ 语音识别：<span style="color: red;">不支持</span>';
                showError('你的浏览器不支持语音合成，建议使用Chrome浏览器。');
                return false;
            }

            // 检查语音识别
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const lastResult = event.results[event.results.length - 1];
                    const text = lastResult[0].transcript;
                    addMessage(`你：${text}`, 'user');
                    sendToAI(text);
                };

                recognition.onerror = (event) => {
                    console.error('语音识别错误:', event.error);
                    if (event.error !== 'no-speech') {
                        addMessage(`⚠️ 语音识别错误：${event.error}`, 'ai');
                    }
                };

                recognition.onend = () => {
                    if (isListening) {
                        // 自动重启
                        setTimeout(() => {
                            try {
                                recognition.start();
                            } catch (e) {
                                console.error('重启语音识别失败:', e);
                                isListening = false;
                                btnStart.disabled = false;
                                btnStop.disabled = true;
                                micStatus.className = 'status-item disconnected';
                                micStatus.querySelector('span').textContent = '已停止';
                            }
                        }, 100);
                    }
                };

                updateStatus(speechStatus, '已就绪', true);
            } else {
                updateStatus(speechStatus, '不支持', false);
                showError('你的浏览器不支持语音识别API。请使用Chrome浏览器。');
                return false;
            }

            // 测试AI连接
            updateStatus(aiStatus, '测试中...', false);
            testAIConnection();

            btnCheck.disabled = true;
            btnStart.disabled = false;

            return true;
        }

        // 测试AI连接
        async function testAIConnection() {
            try {
                const response = await fetch('http://120.48.89.60:8889/health');
                if (response.ok) {
                    updateStatus(aiStatus, '已连接', true);
                    showInfo('✅ 所有检查通过！点击"开始对话"开始使用。');
                    return true;
                } else {
                    throw new Error('响应不正常');
                }
            } catch (error) {
                updateStatus(aiStatus, '连接失败', false);
                showError(`无法连接AI服务器：${error.message}`);
                showInfo('💡 请检查是否可以访问 http://120.48.89.60:8889');
                return false;
            }
        }

        // 开始/停止
        function toggleListening() {
            if (isListening) {
                recognition.stop();
                isListening = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                updateStatus(micStatus, '已停止', false);
                addMessage('⏹️ 已停止对话', 'ai');
            } else {
                try {
                    recognition.start();
                    isListening = true;
                    btnStart.disabled = true;
                    btnStop.disabled = false;
                    updateStatus(micStatus, '正在监听...', true);
                    micStatus.querySelector('span').classList.add('recording');
                    chatContainer.style.display = 'block';
                    addMessage('🎤 开始说话...', 'ai');
                    showInfo('💡 对着麦克风说话，我会听到的！');
                } catch (error) {
                    showError(`启动失败：${error.message}`);
                }
            }
        }

        // 发送到AI
        async function sendToAI(text) {
            try {
                addMessage('⏳ AI正在思考...', 'ai');

                const response = await fetch('http://120.48.89.60:8889/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (data.success) {
                    // 移除"AI正在思考"消息
                    chatContainer.lastChild.classList.add('success');
                    chatContainer.lastChild.textContent = '✅ 收到回复';

                    addMessage(`🤖：${data.text}`, 'ai');

                    // 语音合成
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 1;
                    utterance.pitch = 1;

                    speechSynthesis.speak(utterance);
                } else {
                    addMessage(`❌ AI错误：${data.error}`, 'ai');
                }

            } catch (error) {
                addMessage(`❌ 连接AI失败：${error.message}`, 'ai');
                console.error('AI错误:', error);
                showError('AI连接失败，请检查服务器是否运行');
            }
        }

        // 事件监听
        btnCheck.addEventListener('click', checkBrowserSupport);
        btnStart.addEventListener('click', () => {
            if (!isListening) {
                recognition.start();
                isListening = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                updateStatus(micStatus, '正在监听...', true);
                micStatus.querySelector('span').classList.add('recording');
                chatContainer.style.display = 'block';
                addMessage('🎤 开始说话...', 'ai');
                showInfo('💡 对着麦克风说话，我会听到的！');
            }
        });

        btnStop.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                isListening = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                updateStatus(micStatus, '已停止', false);
                micStatus.querySelector('span').classList.remove('recording');
                addMessage('⏹️ 已停止对话', 'ai');
            }
        });

        // 页面加载时自动检查
        setTimeout(() => {
            showInfo('💡 首先点击"检查浏览器兼容性"按钮');
        }, 1000);
    </script>
</body>
</html>
