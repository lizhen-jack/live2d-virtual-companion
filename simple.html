<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟伴侣 - 简易版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #333;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 30px;
        }

        .status {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-stop {
            background: #e74c3c;
        }

        .btn-stop:hover {
            background: #c0392b;
        }

        #chat-container {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            height: 300px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        .message.user {
            background: #dbeafe;
            text-align: right;
            color: #1e40af;
        }

        .message.ai {
            background: #f3e8ff;
            color: #7c3aed;
        }

        #video-container {
            margin: 20px 0;
            text-align: center;
        }

        video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 虚拟伴侣</h1>
        <p class="subtitle">语音对话 + 摄像头查看</p>

        <div class="status" id="status-container">
            <h3>状态检查</h3>
            <div class="status-item">
                🎤 麦克风：<span id="mic-status">未连接</span>
            </div>
            <div class="status-item">
                📹 摄像头：<span id="camera-status">未连接</span>
            </div>
            <div class="status-item">
                🤖 AI连接：<span id="ai-status">未连接</span>
            </div>
        </div>

        <div id="video-container">
            <video id="user-video" autoplay muted playsinline style="display: none;"></video>
        </div>

        <button class="btn" id="btn-init">初始化（获取权限）</button>
        <button class="btn" id="btn-start" disabled>开始对话</button>
        <button class="btn btn-stop" id="btn-stop" disabled>停止</button>

        <div id="chat-container">
            <div class="message ai">
                👋 你好！点击"初始化"按钮开始。
            </div>
        </div>
    </div>

    <script>
        const micStatus = document.getElementById('mic-status');
        const cameraStatus = document.getElementById('camera-status');
        const aiStatus = document.getElementById('ai-status');
        const btnInit = document.getElementById('btn-init');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const video = document.getElementById('user-video');
        const chatContainer = document.getElementById('chat-container');

        let recognition = null;
        let isListening = false;

        // 添加消息
        function addMessage(text, type = 'ai') {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 初始化（获取权限）
        async function init() {
            try {
                // 请求摄像头权限
                const cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                video.srcObject = cameraStream;
                video.style.display = 'block';
                cameraStatus.textContent = '已连接 ✅';
                cameraStatus.style.color = 'green';

                // 设置语音识别
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognition = new SpeechRecognition();
                    recognition.lang = 'zh-CN';
                    recognition.continuous = true;
                    recognition.interimResults = false;

                    recognition.onresult = (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const text = lastResult[0].transcript;
                        addMessage(`你：${text}`, 'user');

                        // 发送到AI
                        sendToAI(text);
                    };

                    recognition.onerror = (event) => {
                        console.error('语音识别错误:', event.error);
                        addMessage(`❌ 语音识别错误：${event.error}`, 'ai');
                    };

                    micStatus.textContent = '已连接 ✅';
                    micStatus.style.color = 'green';

                    btnInit.disabled = true;
                    btnStart.disabled = false;

                    addMessage('✅ 初始化成功！现在可以点击"开始对话"了。', 'ai');
                } else {
                    addMessage('❌ 你的浏览器不支持语音识别', 'ai');
                    micStatus.textContent = '不支持 ❌';
                }

                // 测试AI连接
                aiStatus.textContent = '测试中...';
                try {
                    const response = await fetch('http://120.48.89.60:8889/health');
                    if (response.ok) {
                        aiStatus.textContent = '已连接 ✅';
                        aiStatus.style.color = 'green';
                    } else {
                        throw new Error('响应不正常');
                    }
                } catch (error) {
                    aiStatus.textContent = '连接失败 ❌';
                    aiStatus.style.color = 'red';
                }

            } catch (error) {
                addMessage(`❌ 初始化失败：${error.message}`, 'ai');
                console.error('初始化错误:', error);

                if (error.name === 'NotAllowedError') {
                    addMessage('⚠️ 请允许访问摄像头和麦克风', 'ai');
                } else if (error.name === 'NotFoundError') {
                    addMessage('⚠️ 未找到麦克风或摄像头设备', 'ai');
                }
            }
        }

        // 发送到AI
        async function sendToAI(text) {
            try {
                addMessage('⏳ AI正在思考...', 'ai');

                const response = await fetch('http://120.48.89.60:8889/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                if (data.success) {
                    addMessage(`AI：${data.text}`, 'ai');

                    // 语音合成
                    const utterance = new SpeechSynthesisUtterance(data.text);
                    utterance.lang = 'zh-CN';
                    utterance.rate = 1;
                    speechSynthesis.speak(utterance);
                } else {
                    addMessage(`❌ AI错误：${data.error}`, 'ai');
                }

            } catch (error) {
                addMessage(`❌ 连接AI失败：${error.message}`, 'ai');
                console.error('AI错误:', error);
                addMessage('💡 请检查是否可以访问 http://120.48.89.60:8889', 'ai');
            }
        }

        // 开始/停止对话
        function toggleListening() {
            if (isListening) {
                recognition.stop();
                isListening = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                addMessage('⏹️ 已停止对话', 'ai');
            } else {
                recognition.start();
                isListening = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                addMessage('🎤 开始说话...', 'ai');
            }
        }

        // 事件监听
        btnInit.addEventListener('click', init);
        btnStart.addEventListener('click', () => {
            if (!isListening) {
                recognition.start();
                isListening = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                addMessage('🎤 开始说话...', 'ai');
            }
        });

        btnStop.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
                isListening = false;
                btnStart.disabled = false;
                btnStop.disabled = true;
                addMessage('⏹️ 已停止对话', 'ai');
            }
        });
    </script>
</body>
</html>
